	<h1>Do Not Sell or Share Information Example</h1>
	<p>This sample demonstrates embedding Data Subject Rights Universal form in an iframe.</p>

	<h2>What to observe</h2>
	<ul>
		<li>Inspect the page cookies in the the developer tools to observe the preferences selected.</li>
		<li>When filling the form and selecting Do not Sell or Share, the cookies will change.</li>
		<li>If using Global Privacy Control (GPC) the only configured non-essential cookie to not track will be Advertising by deault.</li>
	</ul>

	<h2>Navigation</h2>
	<p>Use the navigation above to move between the other test samples and compare behaviors.</p>
	 
    <!-- Embedded DSR form (your URL) -->
    <iframe
      id="dsr-dnss-iframe"
      title="Do Not Sell or Share Request"
      src="https://privacy-central.securiti.ai/dsr-universal-embed/7752fe31-301c-482f-bb85-f11bb69f183b"
    ></iframe>
    <script>
    window.addEventListener('message', (event) => {
        if (event.data.sec_signal_identifier === 'sec-dsr-submission-success') {
            // Process message
            if (window.SecuritiSDK && bannerGenerator && (event.data.sec_dsr_data.ticket_type||[]).includes('do-not-sell')) {
                bannerGenerator.setDoNotSellConsent()
            }
        }
    });
    </script>
