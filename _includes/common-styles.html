<style>
  body {
    font-family: "Nunito Sans", Arial, sans-serif;
    margin: 0;

    color: #202533;
    background: #ffffff;
  }

  .page-header {
    background: #2da3d3;
    color: white;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #258fba;
  }

  .page-header h1 {
    margin: 0 0 0.25rem 0;
    color: white;
    font-weight: 800;
    font-size: 2.2rem;
    letter-spacing: -0.02em;
  }

  .page-header p {
    margin: 0;
    color: rgba(255,255,255,0.94);
    font-size: 1.05rem;
    font-weight: 600;
  }

  nav {
    background: #202533;
    padding: 1rem 1.5rem;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 1rem;
    margin: 0;
    padding: 0;
    flex-wrap: wrap;
  }

  nav a {
    color: white;
    text-decoration: none;
    padding: 0.5rem 0.85rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1.05rem;
  }

  nav a:hover {
    background: rgba(255,255,255,0.08);
  }

  nav a[aria-current="page"] {
    background: white;
    color: #202533;
  }

  main {
    padding: 1.5rem;
  }

    /* ── Footer bar ── */
  .site-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #f5f5f5;
      border-top: 1px solid #ddd;
      padding: 14px 30px;
      display: flex;
      gap: 40px;
      align-items: center;
      z-index: 1;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
  }
  
  /* Shared link style for all footer items */
  .site-footer a,
  .site-footer .cmp-revoke-consent {
      color: #1a2a4a;
      text-decoration: none;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
  }
  
  .site-footer a:hover,
  .site-footer .cmp-revoke-consent:hover {
      text-decoration: underline;
  }
  
  /* Arrow icon after each link */
  .site-footer a::after,
  .site-footer .cmp-revoke-consent::after {
      content: ' ↗';
  }
  
  /* Reset the revoke button so it looks like a plain link */

      background: none !important;
      border: none !important;

      margin: 0 !important;
      font-size: 14px !important;
      font-family: inherit !important;
      color: #1a2a4a !important;
      cursor: pointer !important;
      text-decoration: none !important;
      /* REMOVE fixed positioning — it lives in the footer now */
      position: static !important;
      bottom: auto !important;
      left: auto !important;
      z-index: auto !important;
  }

  /* Revoke button styling */
  .cmp-revoke-consent-button {
    position: fixed !important;

    color: white !important;
    padding: 8px 15px !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    font-size: 14px !important;
